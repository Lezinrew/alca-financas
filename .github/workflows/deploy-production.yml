name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI/CD Pipeline - Supabase"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  # Serializa os deploys para evitar concorrência sobre /apps/alca-financas.
  group: production-deploy
  # Não cancelar um deploy em andamento: interromper entre o git reset e o
  # recreate deixaria o servidor com código e containers de versões diferentes.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: "20.x"
  PYTHON_VERSION: "3.9"
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: alca-financas-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save images
        run: docker save alca-financas-backend:latest | gzip > backend-images.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          timeout: 120s
          source: "backend-images.tar.gz"
          target: "/tmp/"

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          timeout: 120s
          script: |
            set -e
            cd /apps/alca-financas
            git fetch origin
            if git diff --quiet HEAD ${{ env.DEPLOY_SHA }} -- backend/ docker-compose.prod.yml Dockerfile requirements.txt; then
              echo "Backend unchanged: preserving the running container"
              exit 0
            fi
            test -z "$(git status --porcelain --untracked-files=no)" || exit 1
            docker compose -f docker-compose.prod.yml config -q
            umask 077
            backup_dir="/apps/alca-backups/backend-${{ env.DEPLOY_SHA }}-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$backup_dir"
            tar -czf "$backup_dir/frontend-config-before.tar.gz" build/frontend nginx.conf docker-compose.prod.yml
            old_image=$(docker inspect --format '{{.Image}}' alca-financas-backend-1)
            docker image save "$old_image" | gzip > "$backup_dir/backend-image-before.tar.gz"
            gunzip -c /tmp/backend-images.tar.gz | docker load
            rm -f /tmp/backend-images.tar.gz
            git switch --detach ${{ env.DEPLOY_SHA }}
            docker compose -f docker-compose.prod.yml config -q
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate backend

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy-backend]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Build frontend on server into build/frontend
        uses: appleboy/ssh-action@v1.2.0
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          password: ${{ secrets.PROD_PASSWORD }}
          timeout: 120s
          envs: VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY
          script: |
            set -e
            cd /apps/alca-financas
            git fetch origin
            # Run the target script without resetting the live checkout first.
            script_file=$(mktemp /tmp/alca-frontend-deploy.XXXXXX)
            trap 'rm -f "$script_file"' EXIT
            git show ${{ env.DEPLOY_SHA }}:scripts/prod/deploy-frontend-atomic.sh > "$script_file"
            bash "$script_file" ${{ env.DEPLOY_SHA }}

  smoke-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy-backend, deploy-frontend]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: ./frontend
        env:
          TEST_ENV: production
        run: npx playwright test e2e/auth.spec.ts e2e/dashboard.spec.ts --project=chromium

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: frontend/playwright-report/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ⚠️ Production deployment smoke tests failed!
            Repository: ${{ github.repository }}
            Commit: ${{ env.DEPLOY_SHA }}
            Author: ${{ github.actor }}
