name: AI Platform Tests

# Testes da plataforma de IA (contrato docs/contracts/ai-platform-v1.md).
# Só VERIFICA: não faz deploy, não aplica migration em banco real e não usa
# segredos. O deploy de produção escuta apenas o workflow "CI/CD Pipeline -
# Supabase"; este aqui não o dispara.
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/services/ai/**'
      - 'backend/tests/ai/**'
      - 'backend/database/migrations_v2/**'
      - 'backend/services/ofx_import/**'
      - 'backend/services/import_service.py'
      - 'backend/utils/text_repair.py'
      - 'backend/requirements.txt'
      - 'frontend/src/components/ai/**'
      - '.github/workflows/ai-platform-tests.yml'
  push:
    branches: [ 'ci/**', 'ai/**' ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ai-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_VERSION: '18.x'

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }}, PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.9 é a versão do CI principal; 3.12 é a da imagem Docker do backend.
        python-version: [ '3.9', '3.12' ]

    services:
      # Banco descartável do job, com pgcrypto e citext reais (a imagem oficial
      # traz as extensões contrib). Credenciais valem só dentro deste runner.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # O harness (backend/tests/ai/support/pg.py) cria um banco por sessão,
      # aplica as migrations V2 com um papel sem superusuário e apaga ao final.
      AI_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect AI platform sources
        id: sources
        run: |
          if [ -d backend/tests/ai ] && [ -d backend/services/ai ] \
             && [ -f backend/database/migrations_v2/0001_core.sql ] \
             && [ -f backend/database/migrations_v2/0002_ai_platform.sql ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Código da plataforma de IA ou migrations V2 ausentes nesta branch: nenhum teste de backend foi executado."
          fi

      - name: Set up Python
        if: steps.sources.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Python dependencies
        if: steps.sources.outputs.present == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ai-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ai-${{ matrix.python-version }}-

      - name: Install dependencies
        if: steps.sources.outputs.present == 'true'
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pypdf é opcional no código (sem ele todo PDF é recusado). Instalado
          # aqui só para exercitar os testes de páginas e senha de PDF.
          pip install "pypdf>=4,<7" || echo "::warning::pypdf não instalou nesta versão de Python; os testes de PDF serão pulados."

      - name: Check Python 3.9 syntax of the AI package
        if: steps.sources.outputs.present == 'true' && matrix.python-version == '3.9'
        working-directory: ./backend
        run: python -m compileall -q services/ai tests/ai

      - name: Run AI platform tests
        if: steps.sources.outputs.present == 'true'
        working-directory: ./backend
        # Configuração própria: não carrega o conftest legado (Mongo/Supabase)
        # nem exige a cobertura global de 70%.
        run: python -m pytest -c tests/ai/pytest.ini tests/ai -rs

  frontend:
    name: Frontend (tela do operador)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect AI screen sources
        id: sources
        run: |
          if [ -d frontend/src/components/ai ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::frontend/src/components/ai ausente nesta branch: nenhum teste de frontend foi executado."
          fi

      - name: Set up Node.js
        if: steps.sources.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.sources.outputs.present == 'true'
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        if: steps.sources.outputs.present == 'true'
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint (pasta da IA)
        if: steps.sources.outputs.present == 'true'
        working-directory: ./frontend
        run: npx eslint src/components/ai --ext ts,tsx --max-warnings 0

      - name: Run AI screen tests
        if: steps.sources.outputs.present == 'true'
        working-directory: ./frontend
        run: npx vitest run src/components/ai src/App.test.tsx
