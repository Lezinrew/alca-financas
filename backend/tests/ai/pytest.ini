[pytest]
# Configuração própria dos testes da plataforma de IA: não carrega o conftest
# legado (Mongo/Supabase) nem exige a cobertura global de 70%.
#   cd backend && python -m pytest -c tests/ai/pytest.ini tests/ai
python_files = test_ai_*.py
python_functions = test_*
addopts = -q --strict-markers -p no:cacheprovider
markers =
    unit: sem banco nem rede
    integration: usa PostgreSQL real e descartável
    slow: demora mais de alguns segundos
