services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    # Expõe explicitamente as variáveis críticas (interpolação a partir do `.env` na raiz).
    # Sem SUPABASE_JWT_SECRET o Flask rejeita access tokens HS256 do Supabase → 401 em /api/*.
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set SUPABASE_JWT_SECRET in .env}
      SUPABASE_JWT_AUD: ${SUPABASE_JWT_AUD:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      FLASK_ENV: ${FLASK_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      BACKEND_PORT: ${BACKEND_PORT:-8001}
      HOST: ${HOST:-0.0.0.0}
      FRONTEND_URL: ${FRONTEND_URL:-}
    ports:
      - "8001:8001"
    restart: always
    command: gunicorn --bind 0.0.0.0:8001 --workers 4 app:app
    networks:
      - alca-network

  frontend:
    image: nginx:alpine
    volumes:
      - ./build/frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    restart: always
    networks:
      - alca-network

networks:
  alca-network:
    driver: bridge

# OpenClaw (gateway + bridge) removido deste compose em 2026-07-26: exige
# ghcr.io/openclaw/openclaw:main, imagem privada sem credenciais disponíveis.
# Chat via IA (/api/chatbot/*) fica indisponível (erro controlado, "gateway
# indisponível" — ver backend/services/openclaw_service.py) até decisão
# separada de reativar (com credenciais GHCR) ou substituir por outro backend
# de IA. Definições originais em git log (commit anterior a esta mudança).
